# Train configuration — all pipeline knobs live here, never in code.
data:
  raw_path: data/raw/dataset_v1.csv
  target: default_risk
  id_column: loan_id
  features:
    - age
    - income
    - credit_score
    - loan_amount
    - employment_years
    - num_defaults
    - has_collateral

validation:
  min_rows: 100
  max_missing_pct: 0.02
  column_ranges:
    age: [21, 70]
    income: [20000, 250000]
    credit_score: [320, 850]
    loan_amount: [1000, 80000]
    employment_years: [0, 42]
    num_defaults: [0, 5]

split:
  test_size: 0.2
  seed: 42

gate:
  quality:
    min_accuracy_delta: -0.01
    min_f1_delta: -0.01
    min_roc_auc_delta: -0.01
  latency_p95_max_ms: 200
  memory_max_mb: 512
  # cost_max_delta_pct is how much MORE expensive than the production reference
  # a candidate may be (relative). Skipped when no reference exists.
  cost_max_delta_pct: 10
  benchmark:
    n_requests: 200
    seed: 42
    # price used to estimate $ per 1M predictions from measured mean latency
    cpu_hour_usd: 0.1

reproducibility:
  seed: 42

models:
  logistic_regression: {}          # sklearn default baseline
  xgboost:
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.1
    subsample: 0.9
    colsample_bytree: 0.9
    eval_metric: logloss

output:
  model_dir: artifacts/models
  report_dir: data/validation_reports

serving:
  host: 0.0.0.0
  port: 8000
  model_name: modelops_logistic_regression   # loaded from Production stage
  # feature bounds used by Pydantic for structured 422 errors (mirror validation)
  feature_bounds:
    age: [21, 70]
    income: [20000, 250000]
    credit_score: [320, 850]
    loan_amount: [1000, 80000]
    employment_years: [0, 42]
    num_defaults: [0, 5]
    has_collateral: [0, 1]
  latency_history: 5000                        # in-memory served-request latency log

monitoring:
  psi_threshold: 0.2                           # PSI per feature above this = drifted
  psi_bins: 10                                 # equal-width buckets for PSI
  reference_data_path: data/raw/dataset_v1.csv # distribution the model was trained on
  current_data_path: data/drift/current_shifted.csv  # live/current sample
  alert_retrain_on_drift: true