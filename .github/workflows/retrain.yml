name: retrain-on-drift

# Scheduled orchestration: every night, re-measure drift on the current window.
# If any feature's PSI exceeds the threshold AND alert_retrain_on_drift is set,
# retraining is triggered (same gated pipeline the CI runs). Airflow-style DAG
# behaviour without a dedicated scheduler: cron trigger + guard condition.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  MLFLOW_S3_ENDPOINT_URL: http://127.0.0.1:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_DEFAULT_REGION: us-east-1

jobs:
  drift-then-retrain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mlflow
          POSTGRES_PASSWORD: mlflow
          POSTGRES_DB: mlflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlflow -d mlflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "sh -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Postgres + MinIO
        run: |
          python - <<'EOF'
          import socket, time
          for port in (5432, 9000):
              ok = False
              for _ in range(30):
                  try:
                      s = socket.create_connection(("127.0.0.1", port), timeout=1)
                      s.close(); ok = True; break
                  except OSError:
                      time.sleep(2)
              assert ok, f"port {port} not ready"
          print("postgres + minio ready")
          EOF

      - name: Create S3 bucket
        run: |
          python - <<'EOF'
          import boto3
          s3 = boto3.client("s3", endpoint_url="http://127.0.0.1:9000",
                            aws_access_key_id="minioadmin", aws_secret_access_key="minioadmin",
                            region_name="us-east-1")
          s3.create_bucket(Bucket="mlflow-artifacts")
          print("bucket ready")
          EOF

      - name: Start MLflow server (Postgres backend + S3 artifacts)
        run: |
          nohup mlflow server \
            --backend-store-uri "postgresql+psycopg2://mlflow:mlflow@127.0.0.1:5432/mlflow" \
            --default-artifact-root "s3://mlflow-artifacts" \
            --host 127.0.0.1 --port 5000 --allowed-hosts "*" > mlflow-server.log 2>&1 &
          python - <<'EOF'
          import socket, time
          ok = False
          for _ in range(30):
              try:
                  s = socket.create_connection(("127.0.0.1", 5000), timeout=1)
                  s.close(); ok = True; break
              except OSError:
                  time.sleep(2)
          assert ok, "mlflow not ready"
          print("mlflow ready")
          EOF

      - name: Capture current window (live sample simulation)
        run: python scripts/simulate_drift.py

      - name: Run drift check (PSI per feature)
        id: drift
        run: |
          python -m src.monitoring
          python - <<'EOF'
          import json
          r = json.load(open("data/drift_reports/drift_latest.json"))
          flagged = [f for f, d in r["feature_psi"].items() if d["flag"]]
          retrain = bool(flagged)
          with open("GH_TMP_RETRAIN.txt", "w") as fh:
              fh.write("true" if retrain else "false")
          print("flagged:", flagged, "-> retrain:", retrain)
          EOF

      - name: Retrain when drift flagged
        id: gated_retrain
        if: ${{ secrets.RETRAIN_ALLOWED == 'true' }}
        run: |
          retrain=$(cat GH_TMP_RETRAIN.txt)
          echo "retrain=$retrain" >> "$GITHUB_OUTPUT"
          if [ "$retrain" = "true" ]; then
            python -m src.pipeline --track
            python scripts/bake_model.py --name modelops_logistic_regression
            echo "new_certified_version=yes" >> "$GITHUB_OUTPUT"
          else
            echo "no drift — skipping retraining"
          fi

      - name: Upload drift report as evidence
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: data/drift_reports/