name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  MLFLOW_S3_ENDPOINT_URL: http://127.0.0.1:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_DEFAULT_REGION: us-east-1

jobs:
  certify-and-ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mlflow
          POSTGRES_PASSWORD: mlflow
          POSTGRES_DB: mlflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlflow -d mlflow"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Start MinIO (service containers can't pass `server` args)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data --console-address ":9001"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Postgres + MinIO
        run: |
          python - <<'EOF'
          import socket, time
          for port in (5432, 9000):
              ok = False
              for _ in range(30):
                  try:
                      s = socket.create_connection(("127.0.0.1", port), timeout=1)
                      s.close(); ok = True; break
                  except OSError:
                      time.sleep(2)
              assert ok, f"port {port} not ready"
          print("postgres + minio ready")
          EOF

      - name: Create S3 bucket
        run: |
          python - <<'EOF'
          import boto3
          s3 = boto3.client("s3", endpoint_url="http://127.0.0.1:9000",
                            aws_access_key_id="minioadmin", aws_secret_access_key="minioadmin",
                            region_name="us-east-1")
          s3.create_bucket(Bucket="mlflow-artifacts")
          print("bucket ready")
          EOF

      - name: Start MLflow server (Postgres backend + S3 artifacts)
        run: |
          nohup mlflow server \
            --backend-store-uri "postgresql+psycopg2://mlflow:mlflow@127.0.0.1:5432/mlflow" \
            --default-artifact-root "s3://mlflow-artifacts" \
            --host 127.0.0.1 --port 5000 --allowed-hosts "*" > mlflow-server.log 2>&1 &
          python - <<'EOF'
          import socket, time
          ok = False
          for _ in range(30):
              try:
                  s = socket.create_connection(("127.0.0.1", 5000), timeout=1)
                  s.close(); ok = True; break
              except OSError:
                  time.sleep(2)
          assert ok, "mlflow not ready"
          print("mlflow ready")
          EOF

      - name: Unit + integration tests
        run: MLFLOW_TRACKING_URI= python -m pytest tests/ -q

      - name: Gated pipeline on Postgres + S3 (validate -> train -> track -> gate)
        run: python -m src.pipeline --track

      - name: Verify gate report
        run: |
          test -f data/gate_reports/gate_latest.json
          python - <<'EOF'
          import json
          r = json.load(open("data/gate_reports/gate_latest.json"))
          assert "verdicts" in r and "passed" in r, "malformed gate report"
          print("gate passed:", r["passed"], "| verdicts:", r["verdicts"])
          EOF

      - name: Bake certified production snapshot into deploy/model
        run: python scripts/bake_model.py --name modelops_logistic_regression

      - name: Upload gate report + snapshot as evidence
        uses: actions/upload-artifact@v4
        with:
          name: certified-artifacts
          path: |
            data/gate_reports/
            deploy/model/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push serving image (freshly baked model)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/serving.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the real container
        if: github.ref == 'refs/heads/main'
        run: |
          docker run -d --name smoke -p 8000:8000 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8000/ready && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/model/info | python -m json.tool | head -8
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H 'content-type: application/json' \
            -d '{"age":45,"income":85000,"credit_score":720,"loan_amount":65000,"employment_years":10,"num_defaults":0,"has_collateral":1}'
          echo
          docker logs smoke 2>&1 | tail -6