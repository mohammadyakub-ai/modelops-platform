# CI for modelops-platform.
# Every push to main (and each PR) proves the whole ML lifecycle before anything
# ships: tests -> data validation -> training -> regression gate. CFCD pipeline:
# only a gate-PASS run on main builds and publishes the serving image.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit + integration tests
        run: |
          python -m pytest tests/ -q

      - name: Retrain tracked pipeline (validate -> train -> track -> gate)
        run: |
          python -m src.pipeline --track

      - name: Confirm gate report exists and previous deploy survived
        run: |
          test -f data/gate_reports/gate_latest.json
          python - <<'EOF'
          import json
          r = json.load(open("data/gate_reports/gate_latest.json"))
          assert "verdicts" in r and "passed" in r, "malformed gate report"
          print("gate passed:", r["passed"], "| verdicts:", r["verdicts"])
          EOF

      - name: Upload gate report as artifact (evidence for the review)
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: data/gate_reports/

  build-image:
    # CFCD contract: images rebuild only after a gated pipeline on main.
    needs: test-and-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/serving.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max