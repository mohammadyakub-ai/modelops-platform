# Prometheus scrape config for modelops-platform (mounted into the container).
# The serving service exports /metrics; Prometheus scrapes it on an interval and
# Grafana visualizes the stored series.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: modelops-serving
    metrics_path: /metrics
    static_configs:
      - targets: ["serving:8000"]
        labels:
          service: modelops-serving